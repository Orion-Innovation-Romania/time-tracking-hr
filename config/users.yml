# ============================================================================
# TTAH user accounts — kept in sync with Admin → Users.
# ----------------------------------------------------------------------------
# The API updates this file when you create, edit or delete users in the UI.
# On startup it is synced into the database:
#   * New usernames are created (must change password on first login).
#   * Existing users keep the password they chose; profile/role/active refresh.
#   * Removed usernames are deactivated (data is kept).
#   * active: false deactivates the account without deleting the YAML entry.
# ============================================================================
users:
  - username: admin
    role: admin
    initialPassword: Admin#Initial1
    firstName: Admin
    lastName: TTAH
    email: admin@localhost
  - username: hr1
    role: user
    initialPassword: Hr1#Initial1
    firstName: HR
    lastName: One
    email: hr1@localhost
  - username: hr2
    role: user
    initialPassword: Hr2#Initial1
    firstName: HR
    lastName: Two
    email: hr2@localhost
  - username: hr3
    role: user
    initialPassword: Hr3#Initial1
    firstName: HR
    lastName: Three
    email: hr3@localhost
  - username: hr4
    role: user
    initialPassword: Hr4#Initial1
    firstName: HR
    lastName: Four
    email: hr4@localhost
