openapi: 3.0.3
info:
  title: TTAH API
  version: 0.1.0
  description: |
    API NestJS pentru TTAH (HR time tracking). Prefix global: `/api`.

    ## Autentificare

    Sesiunea este pe **cookie-uri HttpOnly** (nu există token în body-ul de login):

    | Cookie          | Rol                         | TTL implicit |
    |-----------------|-----------------------------|--------------|
    | `access_token`  | JWT de acces (obligatoriu)  | 900 s (15 min) |
    | `refresh_token` | Rotire sesiune              | 604800 s (7 zile) |

    Cookie-urile: `HttpOnly`, `SameSite=Lax`, `Path=/`. `Secure` e activ doar când `COOKIE_SECURE=true`.

    **Pentru QA (Postman / Bruno / Newman / Playwright):**

    1. `POST /api/auth/login` cu JSON `{ "username", "password" }`.
    2. Clientul trebuie să **păstreze cookie-urile** (Postman: cookie jar; Newman: `--cookie-jar`; Playwright: `storageState` / context cookies).
    3. Request-urile următoare trimit automat `access_token`.
    4. La 401, apelează `POST /api/auth/refresh` (folosește `refresh_token`) apoi reîncearcă.

    **Bearer (opțional, pentru scripturi):** poți copia valoarea `access_token` din `Set-Cookie`
    și o trimiți ca `Authorization: Bearer <jwt>`. Cookie-ul rămâne metoda folosită de UI.

    **Swagger UI** (`/api/docs`): rulează pe același origin cu API-ul. După *Try it out* pe login,
    cookie-urile sunt setate în browser; restul request-urilor le trimit automat
    (`withCredentials`). Pentru Bearer, deschide **Authorize** și lipește JWT-ul.

    ## Roluri

    | Rol     | Acces |
    |---------|--------|
    | `user`  | Toate rutele autentificate, exceptând cele marcate **admin** |
    | `admin` | Tot ce poate `user`, plus utilizatori, mail Graph, birouri/uși (scris) |

    Rutele **admin** răspund `403 Insufficient permissions` pentru `user`.

    ## Politică parolă

    Dacă `mustChangePassword: true`, aproape toate rutele autentificate răspund
    `403` cu mesajul `PASSWORD_CHANGE_REQUIRED`. Permise în această stare:
    `GET /auth/me`, `POST /auth/change-password`, `POST /auth/logout`,
    `GET /mail/problem-report-policy`, `POST /mail/problem-report`.

    ## Erori

    NestJS JSON: `{ "statusCode": number, "message": string | string[], "error"?: string }`.
    Validare Zod: `400` cu `"error": "ValidationError"` și `message` ca listă de path-uri.

    Rate limits: `429 Too Many Requests` pe forgot/reset password și pe problem-report.

    ## Status HTTP (NestJS)

    `POST` răspunde **201 Created** (inclusiv login), nu 200.
    Excepție: `POST /api/exports/generate` → **200** (trimite fișierul cu `res.send`).
    `GET` / `PUT` / `PATCH` / `DELETE` → **200**.
    `DELETE /api/attendance/day` → 200 sau 404.
  contact:
    name: TTAH
servers:
  - url: http://localhost:4000
    description: API direct (dev) — folosește acest server din Swagger UI
  - url: http://localhost:3000
    description: Prin rewrite Next.js (aceleași cookie-uri ca UI-ul)
  - url: '{origin}'
    description: Alt mediu (Caddy / staging / prod)
    variables:
      origin:
        default: https://localhost
tags:
  - name: Health
    description: Liveness / DB ping (public)
  - name: Auth
    description: Login, sesiune, reset parolă
  - name: Users
    description: "Conturi portal — doar admin"
  - name: Employees
    description: Angajați și program individual
  - name: Offices
    description: Birouri / zone
  - name: Doors
    description: Uși și cititoare
  - name: Attendance
    description: Pontaj, dashboard, corecții
  - name: Imports
    description: Import rapoarte acces (CSV/PDF)
  - name: Exports
    description: Template-uri și generare XLSX/CSV
  - name: Config
    description: Program, prânz, praguri, sărbători, concedii
  - name: Mail
    description: Microsoft Graph, rapoarte, problem-report
  - name: Audit
    description: Jurnal de acțiuni
  - name: System
    description: Resurse gazdă (doar admin)
security:
  - cookieAuth: []
  - bearerAuth: []
paths:
  /api/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Health check
      security: []
      responses:
        '200':
          description: API pornit (db poate fi `up` sau `down`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Login — setează cookie-urile de sesiune
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
            example:
              username: admin
              password: 'ChangeMe123'
      responses:
        '201':
          description: Sesiune creată. Header `Set-Cookie` pentru `access_token` și `refresh_token`.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Două cookie-uri HttpOnly (`access_token`, `refresh_token`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionUser'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Credențiale invalide sau cont blocat temporar (`Account temporarily locked`)

  /api/auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Cere email de resetare parolă
      description: |
        Răspunde `{ ok: true }` și dacă emailul nu există (anti-enumeration).
        Limită: 5 cereri / 15 min per IP, 3 / 15 min per email.
        Cere mail configurat și `PUBLIC_APP_URL`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordInput'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
          description: Cerere acceptată
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: Mail sau URL public neconfigurat

  /api/auth/reset-password:
    get:
      tags: [Auth]
      operationId: peekResetPassword
      summary: Verifică dacă token-ul de reset e valid
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{64}$'
      responses:
        '200':
          description: Token valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          description: Link invalid sau expirat
    post:
      tags: [Auth]
      operationId: completeResetPassword
      summary: Setează parola nouă cu token-ul din email
      description: Limită 10 încercări / 15 min per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordInput'
      responses:
        '201':
          description: Parola schimbată
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Rotire sesiune din cookie-ul refresh_token
      security: []
      responses:
        '201':
          description: Cookie-uri reemise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionUser'
        '401':
          description: Lipsă sau refresh token invalid

  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Șterge cookie-urile de sesiune
      description: Permis și când `mustChangePassword` e true.
      responses:
        '201':
          description: Cookie-uri șterse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Utilizatorul sesiunii curente
      description: Permis și când `mustChangePassword` e true.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionUser'
          description: Sesiune validă
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/change-password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Schimbă parola (reemite cookie-urile)
      description: Permis și când `mustChangePassword` e true. După succes, flag-ul dispare.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordInput'
      responses:
        '201':
          description: Parolă schimbată, sesiune reemisă
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionUser'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: Listează conturile portal
      description: "**admin**"
      x-roles: [admin]
      responses:
        '200':
          description: Lista de conturi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserAccountView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Users]
      operationId: createUser
      summary: Creează un cont
      description: |
        **admin**. Email trebuie `@orioninc.com`. Parola inițială e trimisă pe mail dacă Graph e configurat.
        Username: 2–64, `[a-zA-Z0-9._-]`.
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserInput'
      responses:
        '201':
          description: Cont creat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Username sau email deja folosit

  /api/users/login-history:
    get:
      tags: [Users]
      operationId: listLoginHistory
      summary: Istoric autentificări
      description: "**admin**. Implicit 100, maxim 500."
      x-roles: [admin]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: Cele mai recente încercări de login
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LoginHistory'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/users/{id}:
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Actualizează un cont
      description: "**admin**. Dacă trimiți `initialPassword`, se încearcă un email cu parola."
      x-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserInput'
      responses:
        '200':
          description: Cont actualizat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateUserResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Email deja folosit
    delete:
      tags: [Users]
      operationId: deleteUser
      summary: Dezactivează un cont
      description: "**admin**. Nu poți șterge ultimul admin activ. Nu poți șterge contul curent dacă e ultimul admin."
      x-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Cont dezactivat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          description: Ultimul admin
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/employees:
    get:
      tags: [Employees]
      operationId: listEmployees
      summary: Listează angajații
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: includeInactive
          in: query
          schema:
            type: string
            enum: ['true', 'false']
          description: Trimite `true` ca să incluzi inactivi (implicit doar activi)
      responses:
        '200':
          description: Lista de angajați
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmployeeView'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/employees/departments:
    get:
      tags: [Employees]
      operationId: listDepartments
      summary: Departamente distincte
      responses:
        '200':
          description: Nume de departamente
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /api/employees/{id}:
    get:
      tags: [Employees]
      operationId: getEmployee
      summary: Un angajat
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Angajat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeView'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Employees]
      operationId: updateEmployee
      summary: Actualizează display name / activ / note
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmployeeInput'
      responses:
        '200':
          description: Angajat actualizat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeView'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Employees]
      operationId: deleteEmployee
      summary: Șterge un angajat
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Șters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/employees/{id}/schedule:
    get:
      tags: [Employees]
      operationId: getEmployeeSchedule
      summary: Override de program (sau null)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Override sau `null` dacă folosește programul global
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EmployeeSchedule'
                  - nullable: true
    put:
      tags: [Employees]
      operationId: setEmployeeSchedule
      summary: Setează override de program
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeScheduleInput'
      responses:
        '200':
          description: Override salvat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeSchedule'
        '400':
          $ref: '#/components/responses/ValidationError'

  /api/offices:
    get:
      tags: [Offices]
      operationId: listOffices
      summary: Listează birourile
      responses:
        '200':
          description: Birouri
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OfficeView'
    post:
      tags: [Offices]
      operationId: createOffice
      summary: Creează un birou
      description: "**admin**"
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfficeCreateInput'
      responses:
        '201':
          description: Birou creat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficeView'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/offices/{id}:
    patch:
      tags: [Offices]
      operationId: updateOffice
      summary: Redenumește un birou
      description: "**admin**"
      x-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfficeCreateInput'
      responses:
        '200':
          description: Birou actualizat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficeView'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Offices]
      operationId: deleteOffice
      summary: Șterge un birou
      description: "**admin**"
      x-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Șters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/doors:
    get:
      tags: [Doors]
      operationId: listDoors
      summary: Listează ușile cu cititoare
      responses:
        '200':
          description: Uși
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DoorView'

  /api/doors/{id}:
    patch:
      tags: [Doors]
      operationId: updateDoor
      summary: Actualizează o ușă
      description: "**admin**"
      x-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoorUpdateInput'
      responses:
        '200':
          description: Ușă actualizată (model Prisma Door)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoorRecord'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/doors/{doorId}/readers/{readerId}:
    patch:
      tags: [Doors]
      operationId: updateReader
      summary: Setează rolul cititorului (IN/OUT/NEUTRAL)
      description: "**admin**. Path-ul `doorId` e ignorat; identificatorul e `readerId`."
      x-roles: [admin]
      parameters:
        - name: doorId
          in: path
          required: true
          schema:
            type: integer
        - name: readerId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReaderUpdateInput'
      responses:
        '200':
          description: Cititor actualizat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReaderRecord'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/attendance/summaries:
    post:
      tags: [Attendance]
      operationId: getAttendanceSummaries
      summary: Sumare zilnice pe interval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceFilter'
      responses:
        '201':
          description: Zile calculate
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DailySummaryView'
        '400':
          $ref: '#/components/responses/ValidationError'

  /api/attendance/dashboard:
    post:
      tags: [Attendance]
      operationId: getAttendanceDashboard
      summary: KPI-uri, trend și zone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceFilter'
      responses:
        '201':
          description: Dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardView'

  /api/attendance/month:
    get:
      tags: [Attendance]
      operationId: getMonthAggregates
      summary: Agregate lunare per angajat
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
            example: 2026
        - name: month
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
        - name: employeeIds
          in: query
          schema:
            type: string
            example: '1,2,3'
          description: ID-uri separate prin virgulă
        - name: departments
          in: query
          schema:
            type: string
          description: Departamente separate prin virgulă
      responses:
        '200':
          description: Agregate
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MonthAggregateView'

  /api/attendance/day:
    get:
      tags: [Attendance]
      operationId: getDayDetail
      summary: Detaliu o zi (timeline badge)
      parameters:
        - name: employeeId
          in: query
          required: true
          schema:
            type: integer
        - name: date
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/DateString'
      responses:
        '200':
          description: Detaliu sau `null` dacă nu există sumar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayDetailView'
              examples:
                missing:
                  summary: Fără sumar
                  value: null
    delete:
      tags: [Attendance]
      operationId: deleteAttendanceDay
      summary: Șterge evenimentele și sumarul unei zile
      parameters:
        - name: employeeId
          in: query
          required: true
          schema:
            type: integer
        - name: date
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/DateString'
      responses:
        '200':
          description: Șters
          content:
            application/json:
              schema:
                type: object
                required: [ok, eventsDeleted, summariesDeleted]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  eventsDeleted:
                    type: integer
                  summariesDeleted:
                    type: integer
        '404':
          description: Nimic de șters pentru angajat + dată

  /api/attendance/recompute:
    post:
      tags: [Attendance]
      operationId: recomputeAttendance
      summary: Recalculează pontajul pe interval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecomputeInput'
      responses:
        '201':
          description: Câți angajați au fost recalculați
          content:
            application/json:
              schema:
                type: object
                required: [employees]
                properties:
                  employees:
                    type: integer

  /api/attendance/correction:
    post:
      tags: [Attendance]
      operationId: applyDayCorrection
      summary: Corecție manuală pe o zi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DayCorrectionInput'
      responses:
        '201':
          description: Rând DailySummary (Prisma)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailySummaryRecord'
