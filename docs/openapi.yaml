components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: JWT HttpOnly setat de `/api/auth/login` sau `/api/auth/refresh`.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Același JWT ca `access_token` (util pentru Newman / scripturi).
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    Unauthorized:
      description: Lipsă sau JWT invalid / expirat
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Rol insuficient sau `PASSWORD_CHANGE_REQUIRED`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            roles:
              value:
                statusCode: 403
                message: Insufficient permissions
                error: Forbidden
            password:
              value:
                statusCode: 403
                message: PASSWORD_CHANGE_REQUIRED
                error: Forbidden
    ValidationError:
      description: Body/query invalid (Zod)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            statusCode: 400
            error: ValidationError
            message:
              - 'username: String must contain at least 1 character(s)'
    NotFound:
      description: Resursa nu există
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TooManyRequests:
      description: Rate limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    DateString:
      type: string
      pattern: '^\d{4}-\d{2}-\d{2}$'
      example: '2026-08-19'
    TimeString:
      type: string
      pattern: '^([01]\d|2[0-3]):[0-5]\d$'
      example: '09:00'
    Password:
      type: string
      minLength: 10
      maxLength: 128
      description: Minim 10 caractere, cel puțin o literă și o cifră
      example: ChangeMe1ab
    Role:
      type: string
      enum: [admin, user]
    DoorRole:
      type: string
      enum: [IN, OUT, NEUTRAL]
    EventType:
      type: string
      enum: [ACCESS_GRANTED, ACCESS_DENIED, OTHER]
    LeaveType:
      type: string
      enum: [vacation, sick, remote, other]
    ConditionType:
      type: string
      enum:
        - MIN_SESSION_MINUTES
        - GRACE_START_MINUTES
        - GRACE_END_MINUTES
        - ROUND_DAILY_MINUTES
        - IGNORE_ZONE
        - MAX_DAILY_MINUTES
    AnomalyFlag:
      type: string
      enum:
        - MISSING_EXIT
        - MISSING_ENTRY
        - OVERNIGHT
        - ZERO_DURATION
        - ONLY_OUTSIDE_SCHEDULE
        - MANUAL_OVERRIDE
        - EARLY_START
        - OVERTIME
    ExportKind:
      type: string
      enum: [summary, pontaj, raw]
    ExportFormat:
      type: string
      enum: [xlsx, csv]
    MetricKey:
      type: string
      enum:
        - employeeName
        - department
        - daysPresent
        - workedHours
        - workedMinutes
        - lunchMinutes
        - expectedHours
        - overtimeHours
        - deficitHours
        - firstIn
        - lastOut
        - anomalies
    WelcomeEmailStatus:
      type: string
      enum: [sent, skipped, failed]
    Ok:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]
    ApiError:
      type: object
      required: [statusCode, message]
      properties:
        statusCode:
          type: integer
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        error:
          type: string
    HealthStatus:
      type: object
      required: [status, db, time]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        db:
          type: string
          enum: [up, down]
        time:
          type: string
          format: date-time
    SessionUser:
      type: object
      required: [id, username, role, mustChangePassword]
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        mustChangePassword:
          type: boolean
    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 128
    ForgotPasswordInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    ResetPasswordInput:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
          pattern: '^[a-fA-F0-9]{64}$'
        newPassword:
          $ref: '#/components/schemas/Password'
    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          $ref: '#/components/schemas/Password'
    UserAccountView:
      type: object
      required:
        - id
        - username
        - firstName
        - lastName
        - email
        - role
        - isActive
        - mustChangePassword
        - managedByConfig
        - passwordResetRequestedAt
        - lastLoginAt
        - lockedUntil
        - failedAttempts
        - createdAt
      properties:
        id:
          type: integer
        username:
          type: string
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/Role'
        isActive:
          type: boolean
        mustChangePassword:
          type: boolean
        managedByConfig:
          type: boolean
        passwordResetRequestedAt:
          type: string
          format: date-time
          nullable: true
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        lockedUntil:
          type: string
          format: date-time
          nullable: true
        failedAttempts:
          type: integer
        createdAt:
          type: string
          format: date-time
    CreateUserInput:
      type: object
      required: [username, firstName, lastName, email, initialPassword]
      properties:
        username:
          type: string
          minLength: 2
          maxLength: 64
